services:

  staymatch:

    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env

    expose:
      - "8501"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
        ]

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  app:

    build:
      context: .
      dockerfile: Dockerfile.gateway

    depends_on:
      staymatch:
        condition: service_healthy

    ports:
      - "8080:8080"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/health | grep -q 'ok'"
        ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s